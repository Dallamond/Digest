<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Digest</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Digest</h1>
    </div>
    <button id="openOptions" title="Opciones" aria-label="Opciones">⚙️</button>
  </header>

  <section id="controls">
    <div class="type-selector">
      <label for="summaryType">Tipo de resumen</label>
      <select id="summaryType"></select>
    </div>

    <label class="flash-toggle">
      <span class="switch">
        <input type="checkbox" id="wantFlashcards" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </span>
      <span class="flash-toggle-label">+ Flashcards <span class="flash-toggle-sub">(Modo Estudio)</span></span>
    </label>

    <button id="summarizePage" class="primary primary-action">
      <span class="btn-icon">▶</span> Resumir página
    </button>

    <div class="actions-grid">
      <button id="summarizeSelection" class="secondary-action">
        <span class="btn-icon">✂️</span>
        <span>Selección</span>
      </button>
      <button id="addToQueue" class="secondary-action">
        <span class="btn-icon">🕒</span>
        <span>Cola</span>
      </button>
      <button id="importPdfBtn" class="secondary-action">
        <span class="btn-icon">📄</span>
        <span>PDF</span>
      </button>
      <input type="file" id="pdfFileInput" accept="application/pdf" hidden />
    </div>
  </section>

  <section id="status" hidden>
    <span id="statusSpinner" class="spinner" hidden></span>
    <span id="statusText"></span>
  </section>

  <section id="result" hidden>
    <div class="result-meta">
      <strong id="resultTitle"></strong>
      <a id="resultUrl" href="#" target="_blank" rel="noopener"></a>
      <span id="resultProvider" class="provider-badge" hidden></span>
      <span id="resultKind" class="provider-badge" hidden>📄 PDF</span>
    </div>
    <div id="resultText" class="md-content"></div>
    <div class="result-actions">
      <button id="copyBtn">Copiar</button>
      <button id="exportMdBtn">Exportar .md</button>
      <a id="exportPdfLink" href="#" target="_blank" class="button-link">Exportar PDF</a>
    </div>

    <div id="flashcardsSection" hidden>
      <div class="flashcards-title" id="flashcardsCount">Flashcards</div>
      <div class="result-actions">
        <a id="useFlashcardsLink" href="#" target="_blank" class="button-link primary-link">Usar flashcards →</a>
        <button id="exportAnkiBtn">Exportar a Anki (CSV)</button>
      </div>
    </div>
    <div id="flashcardsError" class="hint-error" hidden></div>
  </section>

  <footer>
    <a id="viewHistory" href="history.html" target="_blank">Ver historial</a>
    <a id="viewQueue" href="history.html#queue" target="_blank">Ver cola</a>
  </footer>

  <script src="vendor/marked.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
